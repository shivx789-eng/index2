<style>
:root{
  --blue:#1565ff;
  --blue-2:#0a3fd1;
  --blue-glow:rgba(21,101,255,.45);
  --ink:#14183a;
  --white:#ffffff;
  --sun:#ffd23f;
  --pink:#ff3d77;
  --orange:#ff7a18;
  --violet:#6a2cff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Barlow',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--white);overflow:hidden;
  background:linear-gradient(165deg,#ff8a1f 0%,#ff4d6d 42%,#a43cff 78%,#6a2cff 100%);
  background-color:#ff4d6d;
}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
.display{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-weight:400;letter-spacing:.02em;line-height:.92}

/* sunburst + confetti atmosphere */
.beam{position:fixed;inset:-30% -30% auto -30%;height:90vh;pointer-events:none;opacity:.22;
  background:repeating-conic-gradient(from 0deg at 50% 60%, #fff 0deg 6deg, transparent 6deg 18deg);
  -webkit-mask:radial-gradient(circle at 50% 60%, #000 0 20%, transparent 62%);mask:radial-gradient(circle at 50% 60%, #000 0 20%, transparent 62%);
  animation:rot 40s linear infinite}
.beam.r{display:none}
@keyframes rot{to{transform:rotate(360deg)}}
.pitch{position:fixed;inset:0;pointer-events:none;opacity:.55;
  background:
    radial-gradient(circle, #ffd23f 2px, transparent 2.5px) 10% 18%/120px 140px,
    radial-gradient(circle, #ffffff 1.6px, transparent 2px) 60% 40%/90px 110px,
    radial-gradient(circle, #6ff7ff 1.8px, transparent 2.3px) 30% 70%/130px 120px}

/* ONE-SCREEN LAYOUT */
.screen{
  position:relative;z-index:1;height:100vh;height:100dvh;max-width:480px;margin:0 auto;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:max(12px,env(safe-area-inset-top)) 16px max(10px,env(safe-area-inset-bottom));
  text-align:center;
}

/* top row */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.live{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:999px;padding:6px 12px;backdrop-filter:blur(6px)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--sun);display:block;animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.mini-join{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  background:var(--blue);color:#fff;border-radius:999px;padding:8px 14px;box-shadow:0 6px 16px var(--blue-glow);border:2px solid #fff}
.mini-join svg{width:13px;height:13px}
.mini-join svg path{fill:#fff}

/* brand */
.brand-block{display:flex;flex-direction:column;align-items:center}
.logo-stage{position:relative;width:clamp(78px,13vh,112px);aspect-ratio:1;margin-bottom:clamp(6px,1.2vh,12px)}
.logo-stage::before{content:"";position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(var(--sun),#fff,var(--blue),var(--sun));animation:spin 5s linear infinite}
.logo-stage::after{content:"";position:absolute;inset:-3px;border-radius:50%;background:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.logo{position:absolute;inset:0;z-index:1;border-radius:50%;overflow:hidden;background:linear-gradient(145deg,var(--blue),var(--violet));display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(20,24,58,.35)}
.logo .initials{font-family:'Bebas Neue',sans-serif;font-size:clamp(32px,5.5vh,44px);color:#fff}
.logo-img{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}
.brand{font-size:clamp(36px,6.4vh,52px);color:#fff;text-shadow:0 4px 0 rgba(20,24,58,.25)}
.brand span{color:var(--sun);text-shadow:0 3px 0 rgba(20,24,58,.45),0 0 18px rgba(20,24,58,.25)}
h1{font-size:clamp(30px,5.6vh,46px);margin-top:clamp(6px,1.2vh,12px);text-shadow:0 3px 0 rgba(20,24,58,.22)}
h1 .o{color:var(--ink)}
.lead{font-size:clamp(13.5px,2vh,16px);color:rgba(255,255,255,.92);margin-top:clamp(4px,1vh,10px);font-weight:600}

/* sport buttons (all clickable) */
.sports{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.sport{
  position:relative;overflow:hidden;border-radius:18px;padding:clamp(9px,1.6vh,14px) 6px;
  background:#fff;color:var(--ink);border:0;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  box-shadow:0 10px 24px rgba(20,24,58,.22);
  transition:transform .15s ease;
}
.sport::before{content:"";position:absolute;left:0;right:0;top:0;height:5px}
.sport.c::before{background:var(--orange)}.sport.f::before{background:var(--pink)}.sport.k::before{background:var(--violet)}
.sport:active{transform:scale(.96)}
.sport svg{position:relative;width:clamp(28px,5vh,40px);height:clamp(28px,5vh,40px)}
.sport.c svg *{stroke:var(--orange)}.sport.c svg circle{fill:var(--orange)}
.sport.f svg *{stroke:var(--pink)}.sport.f svg path:first-of-type{fill:var(--pink)}
.sport.k svg *{stroke:var(--violet)}
.sport b{position:relative;font-family:'Bebas Neue',sans-serif;font-size:clamp(19px,3vh,24px);letter-spacing:.04em;line-height:1;color:var(--ink)}
.sport small{position:relative;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--blue);border-radius:999px;padding:3px 10px;box-shadow:0 3px 8px var(--blue-glow)}

/* quick action chips (all clickable) */
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:flex;align-items:center;justify-content:center;gap:7px;
  border-radius:12px;padding:clamp(8px,1.4vh,11px) 8px;font-weight:700;font-size:clamp(12.5px,1.9vh,14px);
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .15s ease,background .2s ease}
.chip:active{transform:scale(.97)}
.chip:hover{background:rgba(255,255,255,.28)}
.chip svg{width:16px;height:16px;flex:0 0 auto}
.chip svg *{stroke:#fff}
.chip svg circle[fill]{fill:#fff}

/* main CTA */
.cta{
  display:flex;align-items:center;justify-content:center;gap:11px;white-space:nowrap;
  width:100%;min-height:clamp(54px,8.4vh,66px);padding:12px 14px;border-radius:16px;
  background:linear-gradient(180deg,#3b82ff 0%,var(--blue) 50%,var(--blue-2) 100%);color:#fff;
  font-weight:800;font-size:clamp(14px,2.2vh,16.5px);letter-spacing:.03em;text-transform:uppercase;
  border:2px solid rgba(255,255,255,.85);
  box-shadow:0 6px 0 #072c96,0 16px 30px rgba(10,63,209,.45);
  position:relative;overflow:hidden;animation:pop 1.8s ease-in-out infinite;
}
.cta::before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 2.4s ease-in-out infinite}
@keyframes shine{0%,50%{left:-60%}100%{left:130%}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 #072c96}
.cta:focus-visible{outline:3px solid #fff;outline-offset:4px}
.cta .ic{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.cta .ic svg{width:16px;height:16px;margin-left:-2px}
.cta .ic svg path{fill:var(--blue)}
.cta-wrap{position:relative}
.arrow{display:block;font-size:12px;font-weight:800;letter-spacing:.2em;color:#fff;margin-bottom:8px;animation:nudge 1.2s ease-in-out infinite;text-shadow:0 2px 6px rgba(20,24,58,.3)}
@keyframes nudge{50%{transform:translateY(4px)}}

/* footer line */
.foot{font-size:10.5px;color:rgba(255,255,255,.85);line-height:1.5}
.foot a{color:#fff;font-weight:700}
.foot .credit{color:var(--sun);font-weight:800}

@media (max-height:640px){
  .lead{display:none}
  .chips{display:none}
}
@media (max-height:560px){
  .arrow{display:none}
  h1{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
